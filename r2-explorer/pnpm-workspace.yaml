packages:
  - web
# Moved from package.json "pnpm.overrides": pnpm v11 only reads overrides from
# the workspace manifest, so the package.json copy was silently ignored and left
# a duplicate transitive wrangler@4.50.0 in the tree alongside the pinned 4.71.0.
overrides:
  svgo: ^4.1.0
  # One wrangler for the whole tree: @cloudflare/vitest-plugin pins an exact
  # release, and @cloudflare/vite-plugin (via @astrojs/cloudflare) refuses to
  # start below its peer range.
  wrangler: ^4.151.1
  # Security floors for transitive advisories (pnpm audit --audit-level=high).
  # Caret floors keep each package on its current major; a bare ">=" resolves
  # to the newest major and would break dependents such as postcss>nanoid.
  # sharp <0.35.0 inherits libvips CVE-2026-33327/33328/35590/35591
  # (GHSA-f88m-g3jw-g9cj) via @cloudflare/vitest-plugin>miniflare>sharp;
  # fast-uri <3.1.6 host confusion and SSRF (GHSA-v2hh-gcrm-f6hx,
  # GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp) via @astrojs/check;
  # undici <7.29.0 cross-user information disclosure (GHSA-4cwx-7wf7-3272)
  # via @cloudflare/vitest-plugin>miniflare;
  # browserslist <4.28.7 crash and unbounded memory growth
  # (GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx) via @astrojs/preact>@babel/core;
  # postcss <8.5.18 source-map path traversal (GHSA-r28c-9q8g-f849) and
  # nanoid <3.3.18 generator loops (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
  # via vite>postcss;
  # js-yaml <4.3.1 quadratic CPU in !!omap (GHSA-5p4m-2wfm-xmqj) via
  # @astrojs/cloudflare>@astrojs/internal-helpers.
  # sharp <0.35.4 inherits libheif GHSA-g89c-p67h-r497 and GHSA-2jg2-4ch7-h545
  # (GHSA-rgj7-g3m4-5g8c) via miniflare>sharp and astro>sharp;
  # svgo 4.0.x removeScripts bypass (GHSA-w27v-7q3p-w38r) via astro>svgo (the
  # override above);
  # smol-toml <=1.7.0 denial of service (GHSA-7w5x-hrqm-74c2) via
  # @astrojs/internal-helpers>smol-toml.
  # sharp <0.35.5 inherits librsvg CVE-2026-96889 (GHSA-wq5f-xc86-pv6w) via
  # miniflare>sharp;
  # undici <7.29.1 WebSocket subprotocol denial of service and TLS certificate
  # validation bypass (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3) via
  # miniflare>undici;
  # http-cache-semantics <4.3.0 max-stale cross-user cache disclosure
  # (GHSA-ch52-4w7c-c8xp) via astro>http-cache-semantics;
  # source-map-js <1.2.2 event-loop denial of service through indexed source
  # maps (GHSA-68fv-2mgg-jv7q) via vite>postcss>source-map-js.
  sharp: ^0.35.5
  fast-uri: ^3.1.6
  undici: ^7.29.1
  browserslist: ^4.28.7
  postcss: ^8.5.18
  nanoid: ^3.3.18
  js-yaml: ^4.3.1
  smol-toml: ^1.7.1
  http-cache-semantics: ^4.3.0
  source-map-js: ^1.2.2
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - astro@7.4.0
  - "@astrojs/cloudflare@14.4.0"
  - "@astrojs/internal-helpers@0.13.0"
  - "@astrojs/markdown-satteri@0.4.4"
  - "@astrojs/preact@6.1.0"
  - "@astrojs/prism@4.1.0"
  - "@astrojs/telemetry@3.4.0"
  - baseline-browser-mapping@2.11.29
  - "@cloudflare/vitest-plugin@1.4.4"
  - "@cloudflare/workers-types@5.20261016.1"
  - electron-to-chromium@1.5.458
  - miniflare@5.20261012.1-beta
  - undici@7.30.1
  - vitest@5.0.5
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - wrangler@4.151.1
