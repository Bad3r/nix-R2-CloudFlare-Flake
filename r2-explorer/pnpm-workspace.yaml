packages:
  - web
# Moved from package.json "pnpm.overrides": pnpm v11 only reads overrides from
# the workspace manifest, so the package.json copy was silently ignored and left
# a duplicate transitive wrangler@4.50.0 in the tree alongside the pinned 4.71.0.
overrides:
  svgo: ^4.0.1
  wrangler: ^4.108.0
  # Security floors for transitive advisories (pnpm audit --audit-level=high).
  # Caret floors keep each package on its current major; a bare ">=" resolves
  # to the newest major and would break dependents such as postcss>nanoid.
  # sharp <0.35.0 inherits libvips CVE-2026-33327/33328/35590/35591
  # (GHSA-f88m-g3jw-g9cj) via @cloudflare/vitest-pool-workers>miniflare>sharp;
  # fast-uri <3.1.6 host confusion and SSRF (GHSA-v2hh-gcrm-f6hx,
  # GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp) via @astrojs/check;
  # undici <7.29.0 cross-user information disclosure (GHSA-4cwx-7wf7-3272)
  # via @cloudflare/vitest-pool-workers>miniflare;
  # browserslist <4.28.7 crash and unbounded memory growth
  # (GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx) via @astrojs/preact>@babel/core;
  # postcss <8.5.18 source-map path traversal (GHSA-r28c-9q8g-f849) and
  # nanoid <3.3.18 generator loops (GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8)
  # via vite>postcss;
  # js-yaml <4.3.1 quadratic CPU in !!omap (GHSA-5p4m-2wfm-xmqj) via
  # @astrojs/cloudflare>@astrojs/internal-helpers.
  sharp: ">=0.35.0"
  fast-uri: ^3.1.6
  undici: ^7.29.0
  browserslist: ^4.28.7
  postcss: ^8.5.18
  nanoid: ^3.3.18
  js-yaml: ^4.3.1
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@astrojs/telemetry@3.3.3"
  - astro@7.1.3
  - package-manager-detector@1.8.0
  - postcss@8.5.21
